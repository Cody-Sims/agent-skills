name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/agents/**
      - .github/continuous-improvement/**
      - .github/workflows/copilot-setup-steps.yml
      - evals/**
      - package.json
      - scripts/**
      - schemas/**
      - tests/**
  pull_request:
    paths:
      - .github/agents/**
      - .github/continuous-improvement/**
      - .github/workflows/copilot-setup-steps.yml
      - evals/**
      - package.json
      - scripts/**
      - schemas/**
      - tests/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    environment: copilot
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Verify repository tooling
        run: |
          node --version
          npm --version
          npm run validate
          npm test
          npm run registry:check
