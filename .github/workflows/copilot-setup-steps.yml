name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - scripts/**
      - schemas/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - scripts/**
      - schemas/**
      - tests/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify repository tooling
        run: |
          node --version
          npm --version
          npm run validate
          npm test
          npm run registry:check
