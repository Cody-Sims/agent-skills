name: Skill improvement proposal
description: Propose one evidence-backed, independently verifiable catalog improvement.
title: "[Improvement]: "
labels:
  - improvement:proposed
body:
  - type: markdown
    attributes:
      value: |
        Submit one bounded proposal using `schemas/improvement-proposal.schema.json`. A maintainer must approve the unchanged issue body before implementation can begin. The learning agent returns proposal text only and cannot create or update this issue.
  - type: dropdown
    id: contract-version
    attributes:
      label: Contract version
      description: Select the schema version used to validate the proposal.
      options:
        - "1"
    validations:
      required: true
  - type: input
    id: deduplication-identity
    attributes:
      label: Deduplication identity
      description: Enter the stable lowercase, hyphen-separated identity checked against open and completed work.
      placeholder: improve-routing-evaluation-evidence
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the problem, its verified evidence identifiers, and the single outcome this item should achieve.
    validations:
      required: true
  - type: textarea
    id: verified
    attributes:
      label: Verified facts
      description: List identified facts. For every fact, cite its source URL, publisher, retrieval date, and applicable version.
    validations:
      required: true
  - type: textarea
    id: inferences
    attributes:
      label: Inferences
      description: List identified inferences separately. Cite the source URL, publisher, retrieval date, and applicable version for every inference.
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Unknowns
      description: List identified unknowns and how each can be resolved. Enter "None" when there are no known unknowns.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: State the expected measurable improvement without presenting it as proven.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Define the smallest complete change and what remains outside this item.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Effort, risk, and dependencies
      description: Include an S, M, or L effort estimate and every blocking dependency.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Use stable identifiers, independently verifiable outcomes, and verification identifiers.
      placeholder: |
        - AC-1: Outcome. Verification: VERIFY-1.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Define each referenced verification identifier, method, procedure, and expected result.
      placeholder: |
        - VERIFY-1: Command or evaluation. Expected result: observable outcome.
    validations:
      required: true
  - type: textarea
    id: allowed-paths
    attributes:
      label: Allowed paths
      description: List exact repository paths or glob patterns, one per line.
      render: text
    validations:
      required: true
  - type: textarea
    id: protected-paths
    attributes:
      label: Approved protected paths
      description: List protected paths this item explicitly authorizes, one per line. Enter "None" when no protected path is approved.
      render: text
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Required checks
      description: List exact external GitHub check-run names, one per line. Do not list shell commands or the Continuous Improvement Policy check itself.
      render: text
    validations:
      required: true
  - type: textarea
    id: duplicates
    attributes:
      label: Duplicate check
      description: Record the backlog, issue, pull request, and history searches performed and every matching identity or reference.
    validations:
      required: true
  - type: checkboxes
    id: authority-boundary
    attributes:
      label: Authority boundary
      description: Confirm that this submission preserves the learning agent's read-only, proposal-only authority.
      options:
        - label: This proposal does not grant issue creation, repository writes, approval, or queue-state authority.
          required: true